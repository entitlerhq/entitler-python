[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "entitler"
dynamic = ["version"]
description = "The official Entitler SDK for Python: feature access, metered usage, plans and billing."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "1843 Inc." }]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "anyio>=4.4,<5"]
keywords = ["entitler", "entitlements", "feature flags", "usage billing", "subscriptions"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AnyIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]

[project.optional-dependencies]
snapshots = ["cryptography>=42"]

[project.scripts]
entitler = "entitler.cli:main"

[project.urls]
Homepage = "https://entitler.co"
Documentation = "https://github.com/entitlerhq/entitler-python/tree/main/docs"
Repository = "https://github.com/entitlerhq/entitler-python"
Changelog = "https://github.com/entitlerhq/entitler-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "cryptography>=42",
  "coverage[toml]>=7.10",
  "fastapi>=0.118",
  "mypy>=1.18",
  "pdoc>=15",
  "pyright>=1.1.405",
  "pytest>=8.4",
  "respx>=0.22",
  "ruff>=0.13",
  "trio>=0.31",
  "twine>=6.2",
]

[tool.hatch.version]
path = "src/entitler/_version.py"

[tool.hatch.build.targets.sdist]
include = ["/src/entitler", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/entitler"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Written by `entitler generate`, which wraps at 88 like Black; kept exactly as generated.
extend-exclude = ["examples/generated-features/entitler_features.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D", "ANN", "S", "PT", "ASYNC", "A", "C4", "PIE", "RET"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# `timeout` is each attempt's deadline, a different thing from a deadline around the whole call.
"src/entitler/_async*.py" = ["ASYNC109"]
# Answer builders take and write arbitrary JSON, and fake tokens are not credentials.
"src/entitler/testing/*.py" = ["ANN401", "S107"]
"tests/**" = ["D", "S101", "S105", "S106", "ANN401", "PT011"]
"examples/**" = ["D", "S101", "T201"]
"scripts/**" = ["D", "T201", "S"]

[tool.mypy]
strict = true
python_version = "3.11"
# Each example is its own program, so scripts/examples.py checks them one folder at a time.
files = ["src", "tests", "scripts"]

[tool.pyright]
include = ["src", "tests", "examples", "scripts"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
reportPrivateUsage = false
reportUnnecessaryIsInstance = false
reportUnnecessaryComparison = false

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra --strict-markers"
markers = ["integration: talks to the live Entitler API"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["entitler"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError", "\\.\\.\\."]
