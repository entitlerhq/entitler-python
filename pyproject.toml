[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "entitler"
version = "0.0.1"
description = "Official Entitler SDK for Python (not yet available)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "1843 Inc." }]
classifiers = ["Development Status :: 1 - Planning"]

[project.urls]
Homepage = "https://entitler.co"
Repository = "https://github.com/entitlerhq/entitler-python"

[tool.hatch.build.targets.sdist]
exclude = [".github"]

[tool.hatch.build.targets.wheel]
bypass-selection = true
